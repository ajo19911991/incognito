<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吳痕汽車美容</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #fdfdfd;
    }
    .hero {
      background: url('images/DJI_20241107154431_0076_D.gif') center center / cover no-repeat;
      height: 100vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
      flex-direction: column;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
    }
    .hero-content {
      position: relative;
      text-align: center;
      z-index: 1;
    }
    .hero h1 {
      font-size: 3rem;
    }
    .hero p {
      font-size: 1.25rem;
    }
    .section {
      padding: 80px 0;
    }
    .section-title {
      font-weight: bold;
      font-size: 2rem;
      margin-bottom: 30px;
    }
    .carousel-item img {
      width: 100%;
      height: auto;
    }
    .carousel-caption {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
    }
    footer {
      background: #111;
      color: #aaa;
      padding: 40px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- 現場實錄跑馬燈 -->
<section class="section bg-dark text-white">
  <div class="container">
    <div class="section-title text-white">服務現場實錄</div>
    <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="images/766281367.264861.gif" class="d-block w-100" alt="施工畫面1">
        </div>
        <div class="carousel-item">
          <img src="images/766281367.120613.gif" class="d-block w-100" alt="施工畫面2">
        </div>
        <div class="carousel-item">
          <img src="images/766281367.334531.gif" class="d-block w-100" alt="施工畫面3">
        </div>
        <div class="carousel-item">
          <img src="images/766281367.354170.gif" class="d-block w-100" alt="施工畫面4">
        </div>
        <div class="carousel-item">
          <img src="images/766279645.4551122.gif" class="d-block w-100" alt="施工畫面5">
        </div>
        <div class="carousel-item">
          <img src="images/766279645.451997.gif" class="d-block w-100" alt="施工畫面6">
        </div>
        <div class="carousel-item">
          <img src="images/766305543.339969.gif" class="d-block w-100" alt="頂級維護">
        </div>
        <div class="carousel-item">
          <img src="images/766364461.738211.gif" class="d-block w-100" alt="拋光封體">
        </div>
        <div class="carousel-item">
          <img src="images/766365443.642393.gif" class="d-block w-100" alt="膜鬼鍍膜">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
</section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
