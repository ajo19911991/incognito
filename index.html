<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吳痕汽車美容</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Noto Sans TC', sans-serif;
    }
    .hero-section {
      position: relative;
      width: 100vw;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }
    .hero-section img.bg-motion {
      position: absolute;
      top: 50%;
      left: 50%;
      width: auto;
      height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      object-position: center;
      aspect-ratio: 16 / 9;
      z-index: 1;
    }
    .hero-section .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.45);
      z-index: 2;
    }
    .hero-section .content {
      position: relative;
      z-index: 3;
      color: #fff;
      text-align: center;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
      top: 50%;
      transform: translateY(-50%);
    }
    .content h1 {
      font-weight: bold;
      font-size: 6vw;
    }
    .content p {
      font-size: 4vw;
    }
    @media (min-width: 768px) {
      .content h1 { font-size: 2.5rem; }
      .content p { font-size: 1.2rem; }
    }
    .scroll-down {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      color: white;
      z-index: 4;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, 8px); }
    }
  </style>
</head>
<body>
  <section class="hero-section">
    <img src="images/wuhenflew_compressed.webp" alt="背景動畫" class="bg-motion">
    <div class="overlay"></div>
    <div class="content bg-dark bg-opacity-50 rounded p-4">
      <h1>吳痕怎麼洗？</h1>
      <p>洗過上千台車，我們深知車漆最怕的不是刮痕、不是水斑，而是那些藏在你根本沒注意過的地方逐漸卡垢、侵蝕，</p>
      <p>最後再也洗不掉。</p>
      <p class="mt-4">「我不糾結於誰對洗車願意付多少錢，<br>但我在意的是，這錢該用在哪些地方才能真正乾淨、有效。」</p>
    </div>
      <div class="scroll-down">↓</div>
  </section>
</body>
</html>
